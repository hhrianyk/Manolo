{% extends "admin/layout.html" %}
{% block title %}{{ 'Редагувати' if faq.id else 'Додати' }} питання{% endblock %}
{% block content %}
<div class="admin-card">
    <h3><i class="fas fa-question-circle me-2"></i> {{ 'Редагування' if faq.id else 'Нове питання' }}</h3>
    
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Питання *</label>
            <input type="text" name="question" class="form-control" value="{{ faq.question or '' }}" required>
        </div>
        
        <div class="mb-3">
            <label class="form-label">Відповідь *</label>
            <textarea name="answer" class="form-control" rows="5" required>{{ faq.answer or '' }}</textarea>
        </div>
        
        <div class="row">
            <div class="col-md-6">
                <div class="mb-3">
                    <label class="form-label">Порядок сортування</label>
                    <input type="number" name="order" class="form-control" value="{{ faq.order or 0 }}">
                </div>
            </div>
        </div>
        
        <div class="mb-3 form-check">
            <input type="checkbox" name="is_active" class="form-check-input" id="is_active" {% if faq.is_active %}checked{% endif %}>
            <label class="form-check-label" for="is_active">Активне питання</label>
        </div>
        
        <hr>
        
        <div class="mt-3">
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save me-2"></i> Зберегти
            </button>
            <a href="{{ url_for('admin_faqs') }}" class="btn btn-secondary">
                <i class="fas fa-arrow-left me-2"></i> Назад
            </a>
        </div>
    </form>
</div>
{% endblock %}
