{% extends "admin/layout.html" %}
{% block title %}{{ 'Редагувати' if post.id else 'Додати' }} Instagram пост{% endblock %}
{% block content %}
<div class="admin-card">
    <h3><i class="fab fa-instagram me-2"></i> {{ 'Редагування' if post.id else 'Новий пост' }}</h3>
    
    <form method="POST" enctype="multipart/form-data">
        <div class="row">
            <div class="col-md-7">
                <div class="mb-3">
                    <label class="form-label">Опис/Підпис</label>
                    <textarea name="caption" class="form-control" rows="3" placeholder="Опис посту...">{{ post.caption or '' }}</textarea>
                </div>
                
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">Кількість лайків</label>
                            <input type="number" name="likes" class="form-control" value="{{ post.likes or 0 }}">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">Порядок сортування</label>
                            <input type="number" name="order" class="form-control" value="{{ post.order or 0 }}">
                        </div>
                    </div>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Хештеги</label>
                    <input type="text" name="hashtags" class="form-control" value="{{ post.hashtags or '' }}" placeholder="#ManoloCreoArt #Харків">
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Посилання на Instagram</label>
                    <input type="url" name="instagram_url" class="form-control" value="{{ post.instagram_url or '' }}" placeholder="https://instagram.com/p/...">
                </div>
                
                <div class="mb-3 form-check">
                    <input type="checkbox" name="is_active" class="form-check-input" id="is_active" {% if post.is_active %}checked{% endif %}>
                    <label class="form-check-label" for="is_active">Активний пост</label>
                </div>
            </div>
            
            <div class="col-md-5">
                <div class="mb-3">
                    <label class="form-label">Зображення</label>
                    {% if post.image %}
                    <div class="mb-2 text-center">
                        <img src="{{ url_for('static', filename=post.image) }}" class="img-fluid rounded" style="max-height: 250px;">
                    </div>
                    {% endif %}
                    <input type="file" name="image" class="form-control" accept="image/*" {% if not post.image %}required{% endif %}>
                    <small class="text-muted">Рекомендований розмір: 1080x1080px (квадрат)</small>
                </div>
            </div>
        </div>
        
        <hr>
        
        <div class="mt-3">
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save me-2"></i> Зберегти
            </button>
            <a href="{{ url_for('admin_instagram') }}" class="btn btn-secondary">
                <i class="fas fa-arrow-left me-2"></i> Назад
            </a>
        </div>
    </form>
</div>
{% endblock %}
